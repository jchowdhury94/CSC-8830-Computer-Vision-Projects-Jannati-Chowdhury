# Per-app theme for the isolated visitor app.  Streamlit reads a .streamlit/config.toml that sits next to the MAIN SCRIPT of the app
# (Modules/Module_7/room_measurement_question_3/visitor_workflow/app_f8_integrated.py), so the repository root and the main app are not affected.
# The values are the ones the local launcher (run_f8_integrated_app.py) passes as flags: always dark, red accent.
[theme]
base = "dark"
primaryColor = "#C9363E"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
